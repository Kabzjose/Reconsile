packages:
  - 'apps/*'

# pnpm blocks dependency install scripts by default (supply-chain protection).
# These genuinely need theirs: Prisma prepares its engines, esbuild (used by tsx and
# vitest) installs its native binary, unrs-resolver/sharp are Next.js/image build deps.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
  sharp: true
